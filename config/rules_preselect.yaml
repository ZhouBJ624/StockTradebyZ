# rules_preselect.yaml
# 量化初选规则配置文件
# pipeline/select_stock.py 读取本文件中的参数

# ── 全局设置 ─────────────────────────────────────────────────────────
global:
  data_dir: "./data/raw"          # A股日线CSV目录
  output_dir: "./data/candidates" # 候选结果输出目录
  top_m: 5000                     # 流动性池：取成交额最高的 top_m 只
  n_turnover_days: 43             # 滚动成交额窗口（日）
  min_bars_buffer: 10             # 额外的最小 bar 缓冲

# ── B1 策略参数（KDJ + 知行均线多头排列） ────────────────────────────
b1:
  enabled: true
  zx_m1: 14
  zx_m2: 28
  zx_m3: 57
  zx_m4: 114
  j_threshold: 13.0
  j_q_threshold: 0.10

# ── 砖型图（BrickChart）策略参数 ──────────────────────────────────────
brick:
  enabled: false

  # 砖型图计算参数
  n: 8
  m1: 3
  m2: 12
  m3: 12
  t: 8
  shift1: 92
  shift2: 114
  sma_w1: 1
  sma_w2: 1
  sma_w3: 1

  # 选股过滤阈值
  daily_return_threshold: 0.2    # 今日涨幅上限
  brick_growth_ratio: 0.5         # 今日红柱 >= N × 昨日绿柱绝对值
  min_prior_green_bars: 1         # 红柱前至少有几根连续绿柱

  # 知行线参数
  zxdq_ratio: 1.47                 # 收盘价 < zxdq × ratio；null = 不启用
  zxdq_span: 10
  require_zxdq_gt_zxdkx: true
  zxdkx_m1: 14
  zxdkx_m2: 28
  zxdkx_m3: 57
  zxdkx_m4: 114

  # 周线均线多头排列
  require_weekly_ma_bull: true
  wma_short: 5
  wma_mid: 10
  wma_long: 20

# ── 选股公式（f1~f5，各自独立、命中任一即入选、取并集） ────────────────
formulas:
  enabled: true
  warmup_bars: 400          # 周线指标预热所需日线 bar 数
  kdj_n: 9                  # KDJ 周期（阈值均指 J 值）

  macd:                     # MACD 参数（DIF = EMA快 - EMA慢，DEA = EMA(DIF)）
    fast: 12
    slow: 26
    signal: 9

  bbi:                      # BBI = (MA3 + MA6 + MA12 + MA24) / 4
    periods: [3, 6, 12, 24]

  # f1: J<12; -2<涨跌幅<2; (DIF>0 或 DEA>0); BBI>60日线
  f1:
    enabled: true
    j_max: 12
    chg_min: -2
    chg_max: 2
    bbi_ma: 60

  # f2: DIF>0 且 DEA>0; (DIF<0.2 或 DEA<0.2); J<20; DIF<DEA; BBI>60日线; -2<涨跌幅<2
  f2:
    enabled: true
    j_max: 20
    dif_dea_abs_max: 0.2
    chg_min: -2
    chg_max: 2
    bbi_ma: 60

  # f3: (DIF<0 或 DEA<0); DIF>DEA; J<30; BBI>5日线
  f3:
    enabled: true
    j_max: 30
    bbi_ma: 5

  # f4: 日线 J<10; 周线 J<0
  f4:
    enabled: true
    daily_j_max: 10
    weekly_j_max: 0

  # f5: 周线 DIF 上穿 DEA; (周线 DIF>0 或 周线 DEA>0); 周线 BBI>60日线
  f5:
    enabled: true
    bbi_ma: 60
    cross_lookback_weeks: 1  # 金叉需出现在最近 N 根周线内

  # 每条公式内按成交额降序取前 N 只，再取并集（控制候选规模）。
  # 未列出的公式不做截断；留空 {} 表示不启用截断。
  max_per_formula:
    f1: 5
    f2: 5
    f3: 5
    f4: 10
    f5: 5
